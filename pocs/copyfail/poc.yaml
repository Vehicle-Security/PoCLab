apiVersion: poclab/v1
kind: PoC

metadata:
  id: copyfail
  name: "CVE-2026-31431: authencesn page-cache write"
  description: >
    authencesn AEAD ESN out-of-bounds write leads to a page-cache write
    without write permission. Affects Linux 5.x - 6.1.x before patch.
  severity: high
  cve: CVE-2026-31431
  tags: [kernel, lpe, crypto, oob-write]
  references:
    - https://github.com/theori-io/copy-fail-CVE-2026-31431
    - https://copy.fail/

target:
  type: linux-kernel
  kernel: "6.1.14"    # pin to known-vulnerable version
  kernel_config: kernel.config  # enables CONFIG_CRYPTO_AUTHENC, AF_ALG AEAD

exploit:
  source: poc.c

verify:
  type: log
  success_pattern: "page-cache write succeeded|pwned"
  fail_pattern: "Operation not permitted|EPERM|failed"

runtime:
  memory: 256M
  kaslr: "false"
  smep: "true"
  smap: "true"
  user: user        # LPE: start as uid=1000, exploit should escalate to root
