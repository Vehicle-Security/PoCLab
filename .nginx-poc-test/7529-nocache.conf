worker_processes 1;
error_log /home/vita/nginx-poc-lab/7529-error.log info;
pid /home/vita/nginx-poc-lab/7529.pid;
events { worker_connections 64; }
http {
    upstream b { server 127.0.0.1:18081; }
    server {
        listen 17529;
        location / {
            proxy_pass http://b;
        }
    }
